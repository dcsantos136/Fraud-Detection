apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api-stable
spec:
  replicas: 9
  selector:
    matchLabels:
      app: fraud-api
      version: stable
  template:
    metadata:
      labels:
        app: fraud-api
        version: stable
    spec:
      containers:
        - name: fraud-api
          image: fraud-api:stable
          imagePullPolicy: IfNotPresent
          env:
            - name: MODEL_VERSION
              value: stable
          ports:
            - containerPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-api
      version: canary
  template:
    metadata:
      labels:
        app: fraud-api
        version: canary
    spec:
      containers:
        - name: fraud-api-canary
          image: fraud-api:canary
          imagePullPolicy: IfNotPresent
          env:
            - name: MODEL_VERSION
              value: canary
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-api-stable-svc
spec:
  selector:
    app: fraud-api
    version: stable
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-api-canary-svc
spec:
  selector:
    app: fraud-api
    version: canary
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fraud-api-ingress
spec:
  rules:
    - host: fraud-api.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fraud-api-stable-svc
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fraud-api-ingress-canary
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
    nginx.ingress.kubernetes.io/canary-by-header: "X-Canary-Request"
    nginx.ingress.kubernetes.io/canary-by-header-pattern: "always"
spec:
  rules:
    - host: fraud-api.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fraud-api-canary-svc
                port:
                  number: 80
